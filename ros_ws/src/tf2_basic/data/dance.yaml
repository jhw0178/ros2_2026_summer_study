poses:

  home:
    joints: [0.0, 0.0, 0.0, 0.0]
    gripper: 0.010

  bow:
    joints: [0.0, -0.80, 0.55, 0.20]
    gripper: 0.010

  left_up:
    joints: [0.80, -0.40, -0.20, 0.30]
    gripper: 0.010

  right_up:
    joints: [-0.80, -0.40, -0.20, 0.30]
